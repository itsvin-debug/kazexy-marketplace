<body class="bg-background min-h-screen flex items-center justify-center relative overflow-hidden">
<!-- Abstract Gaming Background -->
<div class="absolute inset-0 z-0 bg-cover bg-center opacity-40" data-alt="A subtle, abstract digital art background suitable for a modern gaming platform login screen. Soft, high-key lighting creates a bright, clean aesthetic primarily in pristine whites and pale grays. Delicate, glowing geometric lines and subtle particle effects in deep blue and vibrant purple float gently across the canvas, suggesting high-performance technology, e-sports, and digital connectivity. The overall mood is secure, premium, and tech-forward, providing a sophisticated backdrop without distracting from foreground elements." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAqAbyNl0NU97hTmtl6VUUMlnpGrVO-RJxtkLmGg5Ra64Jl_gh9y9qNmddCdZsw1RGyYTgWcJvbD1ygkMPO6EYREN9xwnbpJ2OskHqQPIxnSfWzioVofFlUPIbMKUMTQkc-Ta-677W3UXuFRZetfyb9sEXkjBbmN9ywRrBF2xmJoo35X1NssZd_ylMdsZFZudpbXHBGSNmN34HqxLDEX_vl5UiTYxy_xikoWSEIKey3BCsBR47GudYW')">
</div>
<!-- Login Card Level 1 Elevation -->
<main class="relative z-10 w-full max-w-[440px] mx-margin-mobile md:mx-0 p-margin-desktop bg-surface-container-lowest rounded-[24px] shadow-[0_15px_40px_-15px_rgba(0,35,111,0.1)] border border-surface-container-highest">
<!-- Header Section -->
<header class="text-center mb-stack-lg">
<h1 class="font-display-lg-mobile text-display-lg-mobile md:font-display-lg md:text-display-lg tracking-tighter text-primary mb-stack-sm">
                Nexus Gaming
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                Masuk untuk melanjutkan pengalaman pro Anda.
            </p>
</header>
<!-- Form Section -->
<form action="#" class="flex flex-col gap-stack-md" method="POST">
<!-- Email Field -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-stack-sm" for="email">Email</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-4 text-outline" data-icon="mail">
<span class="material-symbols-outlined">mail</span>
</span>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline transition-all duration-200 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary-fixed" id="email" name="email" placeholder="nama@email.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-bold text-label-bold text-on-surface mb-stack-sm" for="password">Password</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-4 text-outline" data-icon="lock">
<span class="material-symbols-outlined">lock</span>
</span>
<input class="w-full pl-12 pr-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline transition-all duration-200 focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary-fixed" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<div class="flex justify-end mt-stack-sm">
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Lupa Password?</a>
</div>
</div>
<!-- Submit Button -->
<button class="w-full mt-stack-sm py-3 bg-primary text-on-primary font-label-bold text-label-bold rounded-lg shadow-sm hover:brightness-110 active:scale-[0.98] transition-all duration-200 flex justify-center items-center gap-2" type="submit">
                Masuk
                <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-stack-lg flex items-center">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink-0 mx-4 font-label-md text-label-md text-on-surface-variant">atau</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Social Login -->
<button class="w-full py-3 bg-surface-container-lowest border border-outline-variant text-on-surface font-label-bold text-label-bold rounded-lg hover:bg-surface-container transition-colors duration-200 flex justify-center items-center gap-3" type="button">
<!-- Simulated Google Icon for layout purposes -->
<svg class="w-5 h-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
            Lanjutkan dengan Google
        </button>
<!-- Register Link -->
<div class="mt-stack-lg text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Belum punya akun? <a class="font-label-bold text-label-bold text-primary hover:underline hover:text-primary-container transition-colors" href="#">Daftar sekarang</a>
</p>
</div>
</main>
</body></html>
