<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<title>Sign Up - Nexus Gaming</title>

<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 30px rgba(0, 35, 111, 0.05);
        }
        .input-glow:focus {
            box-shadow: 0 0 0 3px rgba(0, 35, 111, 0.1);
        }
    </style>
</head>
<body class="bg-background min-h-screen flex flex-col font-body-md text-on-background antialiased relative overflow-hidden">
<!-- Background Decor elements -->
<div class="absolute inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute -top-[20%] -right-[10%] w-[50vw] h-[50vw] rounded-full bg-secondary-fixed/20 blur-[120px]"></div>
<div class="absolute -bottom-[20%] -left-[10%] w-[40vw] h-[40vw] rounded-full bg-primary-fixed/20 blur-[100px]"></div>
</div>
<!-- Main Content Area (Transactional - No Global Nav/Footer) -->
<main class="flex-grow flex items-center justify-center p-margin-mobile md:p-margin-desktop z-10 relative">
<div class="w-full max-w-[480px]">
<!-- Logo/Brand Identity -->
<div class="text-center mb-stack-lg">
<a class="inline-block group" href="#">
<span class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg tracking-tighter text-primary dark:text-inverse-primary group-hover:opacity-80 transition-opacity">Nexus Gaming</span>
</a>
<p class="font-body-md text-body-md text-on-surface-variant mt-stack-sm">The Ultimate Pro Marketplace</p>
</div>
<!-- Sign Up Card -->
<div class="glass-panel rounded-xl p-stack-lg md:p-[32px]">
<div class="mb-stack-lg">
<h1 class="font-headline-md text-headline-md text-on-surface mb-stack-sm">Buat Akun Baru</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Bergabunglah dengan ribuan pro gamer lainnya.</p>
</div>
<form action="#" class="space-y-stack-md" method="POST">
<!-- Nama Akun -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-stack-sm" for="name">Nama Akun</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">person</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-md text-body-md rounded-lg py-3 pl-10 pr-4 focus:outline-none focus:border-primary input-glow transition-all" id="name" name="name" placeholder="GamerTag Anda" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-stack-sm" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">mail</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-md text-body-md rounded-lg py-3 pl-10 pr-4 focus:outline-none focus:border-primary input-glow transition-all" id="email" name="email" placeholder="email@contoh.com" required="" type="email"/>
</div>
</div>
<!-- Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-stack-sm" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-md text-body-md rounded-lg py-3 pl-10 pr-4 focus:outline-none focus:border-primary input-glow transition-all" id="password" name="password" placeholder="Min. 8 karakter" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Konfirmasi Password -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-stack-sm" for="confirm_password">Konfirmasi Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">lock_reset</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface font-body-md text-body-md rounded-lg py-3 pl-10 pr-4 focus:outline-none focus:border-primary input-glow transition-all" id="confirm_password" name="confirm_password" placeholder="Ulangi password" required="" type="password"/>
</div>
</div>
<!-- T&C Checkbox -->
<div class="flex items-start mt-stack-md">
<div class="flex items-center h-5">
<input class="w-4 h-4 text-primary bg-surface-container-lowest border-outline-variant rounded focus:ring-primary focus:ring-2" id="terms" name="terms" required="" type="checkbox"/>
</div>
<label class="ml-2 font-body-sm text-body-sm text-on-surface-variant" for="terms">
                            Saya setuju dengan <a class="text-primary hover:underline font-medium" href="#">Syarat &amp; Ketentuan</a> serta <a class="text-primary hover:underline font-medium" href="#">Kebijakan Privasi</a> Nexus Gaming.
                        </label>
</div>
<!-- Submit Button -->
<div class="pt-stack-sm">
<button class="w-full bg-primary hover:bg-primary/90 text-on-primary font-label-bold text-label-bold py-3 px-4 rounded-lg flex items-center justify-center transition-colors shadow-sm hover:shadow-md active:scale-[0.98]" type="submit">
                            Daftar Akun
                            <span class="material-symbols-outlined ml-2 text-[18px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Divider -->
<div class="mt-stack-lg mb-stack-md flex items-center">
<div class="flex-grow border-t border-outline-variant/50"></div>
<span class="mx-4 font-body-sm text-body-sm text-on-surface-variant">atau</span>
<div class="flex-grow border-t border-outline-variant/50"></div>
</div>
<!-- Social Login -->
<button class="w-full bg-surface-container-lowest hover:bg-surface-container-low border border-outline-variant text-on-surface font-label-bold text-label-bold py-3 px-4 rounded-lg flex items-center justify-center transition-colors" type="button">
<svg class="w-5 h-5 mr-3" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Daftar dengan Google
                </button>
<!-- Login Link -->
<p class="mt-stack-lg text-center font-body-sm text-body-sm text-on-surface-variant">
                    Sudah punya akun? <a class="text-primary hover:text-secondary font-label-bold text-label-bold hover:underline transition-colors" href="#">Login di sini</a>
</p>
</div>
</div>
</main>
</body></html>
